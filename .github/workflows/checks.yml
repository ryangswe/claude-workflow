# The lint (ruff.toml) and the tests on every pull request and every push to main. The tests run on
# Python 3.9, the oldest the kit supports, and on a current Python.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - run: pipx run ruff==0.17.4 check .

  tests:
    name: Python ${{ matrix.python }}
    # ubuntu-latest is moving to Ubuntu 26.04, which has no Python 3.9 build for setup-python.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests
