# These are bug-finding rules only, and style is not checked. F is pyflakes (undefined or redefined
# names, unused local variables, broken format strings and similar), without its unused-import and
# empty f-string rules. PLE finds code that fails at run time, ASYNC finds blocking calls and other
# mistakes in async code, and RUF006 finds an asyncio task whose result is dropped. Four ASYNC rules
# that give advice rather than find bugs are left out (ASYNC109, ASYNC110, ASYNC115, ASYNC116).
target-version = "py39"
extend-include = ["plugins/workflow/bin/workflow-kit"]

[lint]
select = ["F", "PLE", "ASYNC", "RUF006"]
ignore = ["F401", "F541", "ASYNC109", "ASYNC110", "ASYNC115", "ASYNC116"]
